          { code=$(curl -s -o /dev/null -w '%{http_code}' -H "$ORIG" -m 20 'https://api.kraken.com/0/public/Ticker?pair=XBTUSD'); acao=$(curl -s -D - -o /dev/null -H "$ORIG" -m 20 'https://api.kraken.com/0/public/Ticker?pair=XBTUSD' | grep -i '^access-control-allow-origin' | tr -d '\r' | cut -d: -f2- | xargs || true); printf '%-5s | %-16s | %s\n' "$code" "${acao:-NENHUM}" 'https://api.kraken.com/0/public/Ticker?pair=XBTUSD'; } >> out/probe.txt
      - name: publica
        run: |
          git config user.name probe-bot
          git config user.email probe@bot.local
          cp out/probe.txt probe.txt 2>/dev/null || true
          git add -A
          git diff --cached --quiet || git commit -m "probe"
          git push
